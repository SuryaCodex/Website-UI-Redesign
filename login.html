<style>
        body {
            background-color: #f9f9ff;
            color: #111c2d;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .floating-label-group {
            position: relative;
        }
        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);
            color: #004ac6;
            background-color: transparent;
            padding: 0 4px;
        }
        .floating-label-group label {
            position: absolute;
            top: 14px;
            left: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
            color: #737686;
        }
        .btn-press:active {
            transform: scale(0.97);
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-entrance {
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Pulse for loading button */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .btn-loading {
            pointer-events: none;
            animation: pulse-subtle 1s ease-in-out infinite;
        }

        /* View transition dummy state */
        .page-transitioning {
            opacity: 0;
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-md">

<!-- Login Form Card -->

<form class="space-y-lg" id="loginForm">
<!-- Email Field -->

<label class="font-label-lg text-label-lg" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="floating-label-group">
<input class="w-full h-14 px-md bg-surface-container-low border border-outline-variant rounded-xl focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="font-label-lg text-label-lg" for="password">Password</label>
<button class="absolute right-4 top-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">Forgot Password?</a>

<script>
    const loginForm = document.getElementById('loginForm');
    const signInBtn = document.getElementById('signInBtn');
    const signUpLink = document.getElementById('signUpLink');
    const mainContent = document.querySelector('main');

    // Password visibility toggle logic
    document.querySelectorAll('.floating-label-group button').forEach(btn => {
        btn.addEventListener('click', function() {
            const input = this.parentElement.querySelector('input');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    });

    // Form submission interactivity
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Start loading state
        signInBtn.classList.add('btn-loading');
        signInBtn.innerHTML = `
            <span class="material-symbols-outlined animate-spin">sync</span>
            <span>Signing in...</span>
        `;
        
        // Simulate a brief delay before "redirecting"
        setTimeout(() => {
            // Fade out page
            mainContent.classList.add('page-transitioning');
            
            setTimeout(() => {
                // Navigate to dashboard
                window.location.href = '#dashboard';
                // Note: In a real system we'd use actual routing or the provided ID
                // To fulfill the request conceptually with the provided ID:
                console.log('Redirecting to {{DATA:SCREEN:SCREEN_117}}');
                // Mocking navigation by changing view
                window.location.href = 'dashboard.html';
            }, 300);
        }, 1200);
    });

    // Sign up placeholder transition
    signUpLink.addEventListener('click', (e) => {
        e.preventDefault();
        mainContent.classList.add('page-transitioning');
        setTimeout(() => {
            // Sign up flow placeholder
            mainContent.classList.remove('page-transitioning');
        }, 500);
    });
</script>
